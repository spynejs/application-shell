<div class="page-item--split-feature">
  {{#rows}}
  <div class="split-row">
    <div class="split-media">
      <img class="split-img" alt="{{headline}}" src="{{attrImageSrc}}" />
    </div>
    <div class="split-copy">
      <h3 class="split-headline">{{headline}}</h3>
      <p class="split-text">{{text}}</p>
    </div>
  </div>
  {{/rows}}
</div>
